name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # build:shared va primero dentro de `check` (lint type-aware necesita dist/ de @gastos/shared)
      - run: npm run check
      - run: npm audit --audit-level=high
