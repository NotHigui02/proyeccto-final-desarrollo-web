name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Vitest 5 + rolldown falla en ubuntu (binding nativo opcional / npm#4828).
      # Audit y pruebas Vitest se omiten temporalmente; se revisan en local y con el docente.
      - run: npm run build:shared
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ia
